name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      # H2 테스트와 마이그레이션 · Redis 컨테이너 테스트
      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/test-results/test

      # Docker 가 있는 CI 에서 컨테이너 테스트 건너뜀 금지
      - name: Check skipped tests
        if: always()
        run: bash .github/ci/check-skipped-tests.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: build/reports/jacoco/test/html

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit test
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: /api
          VITE_WS_BASE_URL: /ws

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Write .env
        run: |
          cat > .env <<'ENV'
          DB_NAME=collabus
          DB_USERNAME=collabus
          DB_PASSWORD=collabus
          DB_ROOT_PASSWORD=rootpassword
          JWT_SECRET=ci-secret-key-for-e2e-tests-only-32bytes-min
          RATE_LIMIT_ENABLED=false
          ENV

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for app
        run: |
          for _ in $(seq 1 60); do
            [ "$(docker inspect --format='{{.State.Health.Status}}' collabus-app)" = "healthy" ] && exit 0
            sleep 5
          done
          docker compose logs app
          exit 1

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install browser
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run E2E
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

