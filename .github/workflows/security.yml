name: Security scan

on:
  push:
    branches: [ main ]
  pull_request:
  # 새로 공개된 취약점 확인용 주간 실행
  schedule:
    - cron: '0 0 * * 1'

jobs:
  image-scan:
    name: Image vulnerability scan
    runs-on: ubuntu-latest
    env:
      TRIVY_IMAGE: aquasec/trivy:0.58.1
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: |
          docker build -t collabus-app:scan .
          docker build -t collabus-frontend:scan frontend

      # 고칠 버전이 나온 HIGH · CRITICAL 이 있으면 실패, 예외 목록은 .trivyignore
      - name: Scan backend image
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" -w /src "$TRIVY_IMAGE"
          image --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore --exit-code 1 collabus-app:scan

      - name: Scan frontend image
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/src" -w /src "$TRIVY_IMAGE"
          image --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore --exit-code 1 collabus-frontend:scan
