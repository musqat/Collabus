name: Security scan

on:
  push:
    branches: [ main ]
  pull_request:
  # 코드가 그대로여도 새로 공개된 취약점을 잡기 위한 주간 실행
  schedule:
    - cron: '0 0 * * 1'

jobs:
  image-scan:
    name: Image vulnerability scan
    runs-on: ubuntu-latest
    env:
      TRIVY_IMAGE: aquasec/trivy:0.58.1
    steps:
      - uses: actions/checkout@v7

      - name: Build images
        run: |
          docker build -t collabus-app:scan .
          docker build -t collabus-frontend:scan frontend

      # 고칠 버전이 나온 HIGH · CRITICAL 만 표시. 지금은 결과만 남기고 빌드를 막지 않음
      - name: Scan backend image
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 collabus-app:scan

      - name: Scan frontend image
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 collabus-frontend:scan
