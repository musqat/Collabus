services:
  app:
    build: .
    container_name: collabus-app
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - collabus-network
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-collabus}
      DB_USERNAME: ${DB_USERNAME:-collabus}
      DB_PASSWORD: ${DB_PASSWORD}
      FILE_UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads

  mysql:
    image: mysql:8.0
    container_name: collabus-mysql
    ports:
      - "3307:3306"
    networks:
      - collabus-network
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-collabus}
      MYSQL_USER: ${DB_USERNAME:-collabus}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-/ws}
    container_name: collabus-frontend
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - collabus-network

  redis:
    image: redis:7
    container_name: collabus-redis
    ports:
      - "6379:6379"
    networks:
      - collabus-network
    volumes:
      - redis-data:/data

networks:
  collabus-network:
    driver: bridge

volumes:
  redis-data:
  mysql-data:
  uploads:
