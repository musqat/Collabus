<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="-apple-system, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="380" rx="16" fill="#f8fafc"/>
  <text x="28" y="38" font-size="17" font-weight="700" fill="#0f172a">배포 구조</text>
  <text x="28" y="60" font-size="12.5" fill="#64748b">모두 무료 등급</text>

  <!-- 브라우저 -->
  <g text-anchor="middle">
    <rect x="28" y="150" width="130" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="93" y="182" font-size="14" font-weight="600" fill="#0f172a">브라우저</text>
    <text x="93" y="202" font-size="11.5" fill="#64748b">React SPA</text>
  </g>

  <!-- Vercel -->
  <g text-anchor="middle">
    <rect x="236" y="84" width="190" height="70" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="331" y="114" font-size="14" font-weight="600" fill="#0f172a">Vercel</text>
    <text x="331" y="134" font-size="11.5" fill="#64748b">화면 정적 파일 · 라우트별 분할</text>
  </g>

  <!-- Fly -->
  <g>
    <rect x="236" y="184" width="300" height="184" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
    <text x="256" y="212" font-size="14" font-weight="600" fill="#0f172a">Fly.io</text>
    <text x="256" y="232" font-size="11.5" fill="#64748b">요청이 없으면 일시 정지, 다음 요청에 재개</text>
    <rect x="256" y="248" width="260" height="56" rx="10" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="386" y="272" text-anchor="middle" font-size="13.5" font-weight="600" fill="#3730a3">Spring Boot</text>
    <text x="386" y="292" text-anchor="middle" font-size="11.5" fill="#4338ca">app 사용자로 실행</text>
    <rect x="256" y="320" width="260" height="34" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="386" y="342" text-anchor="middle" font-size="12" fill="#334155">볼륨 · 첨부파일</text>
    <line x1="386" y1="304" x2="386" y2="316" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  </g>

  <!-- DB · Redis -->
  <g text-anchor="middle">
    <rect x="664" y="150" width="300" height="74" rx="12" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="814" y="180" font-size="14" font-weight="600" fill="#0c4a6e">Aiven MySQL 8.4</text>
    <text x="814" y="202" font-size="11.5" fill="#0369a1">Flyway 마이그레이션 · TLS 접속</text>

    <rect x="664" y="252" width="300" height="74" rx="12" fill="#fff7ed" stroke="#fdba74"/>
    <text x="814" y="282" font-size="14" font-weight="600" fill="#9a3412">Upstash Redis</text>
    <text x="814" y="304" font-size="11.5" fill="#9a3412">로그인 세션 · 블랙리스트 · 실패 횟수 · IP 제한</text>
  </g>

  <!-- 연결 -->
  <g stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M158 172 L200 172 L200 119 L232 119"/>
    <path d="M158 198 L200 198 L200 276 L252 276"/>
    <path d="M516 262 L600 262 L600 187 L660 187"/>
    <path d="M516 290 L660 290"/>
  </g>
  <g font-size="11.5" fill="#475569">
    <text x="206" y="112">화면</text>
    <text x="194" y="250" text-anchor="end">REST · STOMP</text>
    <text x="606" y="228">JPA</text>
    <text x="566" y="283">Lettuce</text>
  </g>
</svg>
