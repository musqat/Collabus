spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:collabus}?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:collabus}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      # 스키마는 Flyway 가 관리한다. Hibernate 는 엔티티와 스키마가 어긋나면 기동을 막는 역할만 한다.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # 이미 운영 중인 DB(기존 ddl-auto 로 만들어진 스키마)에 붙을 때를 대비한 설정
    baseline-on-migrate: true
    baseline-version: 0
  data:
    web:
      pageable:
        max-page-size: 100
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

logging:
  level:
    org.springframework.security: INFO

management:
  endpoints:
    web:
      exposure:
        # 헬스체크
        include: health
  endpoint:
    health:
      show-details: never
