server:
  # 종료 신호 뒤 처리 중인 요청까지 마무리
  shutdown: graceful

spring:
  lifecycle:
    # 종료 대기 상한
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:collabus}?sslMode=${DB_SSL_MODE:DISABLED}&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:collabus}
    password: ${DB_PASSWORD}
    # 커넥션 풀 크기와 유휴 연결 유지 시간
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000
      validation-timeout: 1000
      idle-timeout: 120000
  jpa:
    # 영속성 컨텍스트는 서비스 트랜잭션 안에서만 사용
    open-in-view: false
    hibernate:
      # 엔티티와 스키마가 어긋나면 기동 중단. 스키마는 Flyway 담당
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # 마이그레이션 이력이 없는 기존 DB 를 기준점으로 등록
    baseline-on-migrate: true
    baseline-version: 0
  data:
    web:
      pageable:
        max-page-size: 100
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:false}
      # 명령 응답 대기 상한(ms)
      timeout: ${REDIS_TIMEOUT:3000}
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

# 로그인 · 회원가입 IP 단위 제한
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  # 접속 IP 를 읽을 헤더 이름
  client-ip-header: ${CLIENT_IP_HEADER:}
  login-per-minute: ${RATE_LIMIT_LOGIN_PER_MINUTE:20}
  register-per-hour: ${RATE_LIMIT_REGISTER_PER_HOUR:5}

logging:
  level:
    org.springframework.security: INFO

springdoc:
  # API 문서와 Swagger UI 노출
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        # 헬스체크
        include: health
  endpoint:
    health:
      show-details: never
