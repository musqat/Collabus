spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: localhost
      port: 6379

file:
  upload-dir: uploads

jwt:
  secret: Kz!3rLxT#9pQ$UnyDwFeGmXaVoTcYuRi
  expiration: 900000 # 15분
  refresh-expiration: 604800000 # 7일 (ms)

logging:
  level:
    org.springframework.security: DEBUG
