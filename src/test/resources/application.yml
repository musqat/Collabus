# 테스트 전용 설정. Flyway 없이 엔티티로 H2 스키마 생성
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

file:
  upload-dir: ${java.io.tmpdir}/collabus-test-uploads

jwt:
  secret: test-only-secret-key-must-be-at-least-32-bytes-long
  expiration: 900000
  refresh-expiration: 604800000

# 테스트 환경의 IP 단위 제한 해제
rate-limit:
  enabled: false
