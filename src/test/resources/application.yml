# 테스트 전용 설정
# 마이그레이션(V1, V2)은 MySQL 전용 DDL/DML 이라 H2 에서 실행되지 않는다.
# 테스트는 Flyway 를 끄고 Hibernate 가 엔티티에서 직접 스키마를 만들게 한다.
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    defer-datasource-initialization: false
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  data:
    redis:
      host: localhost
      port: 6379

file:
  upload-dir: ${java.io.tmpdir}/collabus-test-uploads

jwt:
  secret: test-only-secret-key-must-be-at-least-32-bytes-long
  expiration: 900000
  refresh-expiration: 604800000
