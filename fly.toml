app = "collabus-api"
# DB(Aiven)가 벵갈루루라 가장 가까운 곳에 둔다
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  DB_NAME = "collabus"
  DB_SSL_MODE = "REQUIRED"
  REDIS_SSL = "true"
  FILE_UPLOAD_DIR = "/data/uploads"
  SWAGGER_ENABLED = "true"
  # 컨테이너 메모리를 기준으로 힙 상한을 잡는다
  JAVA_TOOL_OPTIONS = "-XX:MaxRAMPercentage=70"

[http_service]
  internal_port = 8080
  force_https = true
  # 요청이 없으면 메모리째 일시 정지하고 다음 요청에 재개
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/actuator/health"

# 첨부파일 보관 디스크
[[mounts]]
  source = "collabus_uploads"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
