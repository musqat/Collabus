app = "collabus-api"
# DB 와 가장 가까운 리전
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  DB_NAME = "collabus"
  DB_SSL_MODE = "REQUIRED"
  REDIS_SSL = "true"
  FILE_UPLOAD_DIR = "/data/uploads"
  # Fly 엣지가 붙이는 접속 IP 헤더
  CLIENT_IP_HEADER = "Fly-Client-IP"
  SWAGGER_ENABLED = "true"
  # 컨테이너 메모리 기준 힙 상한
  JAVA_TOOL_OPTIONS = "-XX:MaxRAMPercentage=70"

[http_service]
  internal_port = 8080
  force_https = true
  # 요청이 없으면 메모리째 일시 정지, 다음 요청에 재개
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "60s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/actuator/health"

# 첨부파일 보관 디스크
[[mounts]]
  source = "collabus_uploads"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
